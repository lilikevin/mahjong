<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>body{font:14px sans-serif;margin:8px}canvas{max-width:100%;border:1px solid #888}pre{white-space:pre-wrap}</style>
<input type="file" accept="image/*" id="f"> 門檻 <input type="number" id="th" value="0.15" step="0.05" min="0.01" max="0.9" style="width:60px">
<canvas id="cv"></canvas><pre id="o">載入模型中…</pre>
<script>
const L="1m 1p 1s 1z 2m 2p 2s 2z 3m 3p 3s 3z 4m 4p 4s 4z 5m 5p 5s 5z 6m 6p 6s 6z 7m 7p 7s 7z 8m 8p 8s 9m 9p 9s 0m 0p 0s".split(" ");
const S=640,o=document.getElementById("o"),cv=document.getElementById("cv");let sess;
ort.InferenceSession.create("mahjong-yolon-best.onnx",{executionProviders:["wasm"]})
 .then(s=>{sess=s;o.textContent="模型已載入，輸入："+s.inputNames+" 輸出："+s.outputNames})
 .catch(e=>o.textContent="載入失敗："+e);
function iou(a,b){const x1=Math.max(a.x1,b.x1),y1=Math.max(a.y1,b.y1),x2=Math.min(a.x2,b.x2),y2=Math.min(a.y2,b.y2);
 const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);return i/((a.x2-a.x1)*(a.y2-a.y1)+(b.x2-b.x1)*(b.y2-b.y1)-i+1e-9)}
f.onchange=async e=>{
 try{
 o.textContent="辨識中…";
 const bmp=await createImageBitmap(e.target.files[0],{imageOrientation:"from-image"});
 const r=Math.min(S/bmp.width,S/bmp.height),w=Math.round(bmp.width*r),h=Math.round(bmp.height*r);
 const c=new OffscreenCanvas(S,S),g=c.getContext("2d");
 g.fillStyle="rgb(114,114,114)";g.fillRect(0,0,S,S);
 const dx=(S-w)>>1,dy=(S-h)>>1;g.drawImage(bmp,dx,dy,w,h);
 const d=g.getImageData(0,0,S,S).data,n=S*S,t=new Float32Array(3*n);
 for(let i=0;i<n;i++){t[i]=d[i*4]/255;t[n+i]=d[i*4+1]/255;t[2*n+i]=d[i*4+2]/255}
 const out=await sess.run({[sess.inputNames[0]]:new ort.Tensor("float32",t,[1,3,S,S])});
 const y=out[sess.outputNames[0]],[,ch,N]=y.dims,nc=ch-4,a=y.data,th=+document.getElementById("th").value;
 let cand=[];
 for(let i=0;i<N;i++){let m=0;const sc=new Array(nc);
  for(let k=0;k<nc;k++){const v=a[(4+k)*N+i];sc[k]=v;if(v>m)m=v}
  if(m<th)continue;
  const cx=a[i],cy=a[N+i],bw=a[2*N+i],bh=a[3*N+i];
  cand.push({m,sc,x1:cx-bw/2,y1:cy-bh/2,x2:cx+bw/2,y2:cy+bh/2})}
 cand.sort((p,q)=>q.m-p.m);
 const keep=[];
 for(const k of cand){if(keep.every(q=>iou(k,q)<0.45))keep.push(k)}
 keep.sort((p,q)=>p.x1-q.x1);
 cv.width=bmp.width;cv.height=bmp.height;const cg=cv.getContext("2d");cg.drawImage(bmp,0,0);
 cg.lineWidth=Math.max(3,bmp.width/300);cg.font=Math.max(24,bmp.width/40)+"px sans-serif";
 let txt="輸出形狀："+y.dims+"（類別數 "+nc+"），門檻 "+th+"，偵測到 "+keep.length+" 個框（由左至右）\n\n";
 keep.forEach((k,idx)=>{
  const X1=(k.x1-dx)/r,Y1=(k.y1-dy)/r,X2=(k.x2-dx)/r,Y2=(k.y2-dy)/r;
  cg.strokeStyle="lime";cg.fillStyle="yellow";cg.strokeRect(X1,Y1,X2-X1,Y2-Y1);cg.fillText("#"+(idx+1),X1,Math.max(Y1-4,28));
  const top=k.sc.map((v,i)=>[v,i]).sort((p,q)=>q[0]-p[0]).slice(0,3);
  txt+="#"+(idx+1)+" 位置("+((X1+X2)/2|0)+","+((Y1+Y2)/2|0)+") 框寬"+((X2-X1)|0)+"\n"+
   top.map((p,j)=>"   第"+(j+1)+"名 "+(L[p[1]]||"待確認")+"（編號"+p[1]+"）可信度 "+p[0].toFixed(2)).join("\n")+"\n\n"});
 o.textContent=txt;
 }catch(err){o.textContent="錯誤："+err}
};
</script>
